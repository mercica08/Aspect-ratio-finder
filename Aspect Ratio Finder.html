<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Aspect Ratio Finder</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: measurements and the W:H result on the left, a drafting-grid preview on the right; stacks to one column on phones. */
:root {
  --bg: #EDF0F3;
  --surface: #F8FAFB;
  --ink: #121C26;
  --muted: #56636F;
  --line: #C9D2DA;
  --grid: rgba(18, 28, 38, 0.06);
  --accent: #0B6E7A;
  --accent-ink: #FFFFFF;
  --frame: #D3EBEE;
  --err: #B3261E;
  --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B;
    --surface: #151E26;
    --ink: #E6ECF1;
    --muted: #93A0AC;
    --line: #2A3641;
    --grid: rgba(230, 236, 241, 0.06);
    --accent: #4FC3CF;
    --accent-ink: #06262A;
    --frame: #12313A;
    --err: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B;
  --surface: #151E26;
  --ink: #E6ECF1;
  --muted: #93A0AC;
  --line: #2A3641;
  --grid: rgba(230, 236, 241, 0.06);
  --accent: #4FC3CF;
  --accent-ink: #06262A;
  --frame: #12313A;
  --err: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; }
header { margin-bottom: 24px; }
h1 {
  margin: 0 0 6px;
  font: 800 clamp(28px, 5vw, 40px)/1.1 var(--display);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  min-width: 0;
}
.eyebrow {
  display: block;
  margin: 0 0 8px;
  font: 600 12px/1.2 var(--body);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { position: relative; min-width: 0; }
.field input {
  width: 100%;
  font: 500 22px/1.2 var(--mono);
  font-variant-numeric: tabular-nums;
  padding: 12px 40px 12px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}
.field input[aria-invalid="true"] { border-color: var(--err); }
.unit-tag {
  position: absolute;
  right: 12px;
  bottom: 15px;
  font: 400 13px/1 var(--mono);
  color: var(--muted);
  pointer-events: none;
}
.unit-pick { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
.unit-pick label { margin: 0; }
select {
  font: 500 14px/1.2 var(--mono);
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}
input:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.result { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.ratio-line { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ratio {
  margin: 0;
  min-width: 0;
  font: 800 clamp(48px, 9vw, 72px)/1 var(--display);
  letter-spacing: -0.03em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.ratio.long { font-size: clamp(28px, 6vw, 40px); }
.ratio.empty { color: var(--muted); }
.copy {
  font: 600 13px/1 var(--body);
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.copy:hover { border-color: var(--accent); }
.copy[disabled] { opacity: 0.4; cursor: default; }
.msg { margin: 10px 0 0; min-height: 1.5em; color: var(--err); font-size: 14px; }

.stage {
  position: relative;
  height: 340px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  overflow: hidden;
}
.rect {
  position: relative;
  border: 2px solid var(--accent);
  background: var(--frame);
  width: 160px;
  height: 90px;
}
@media (prefers-reduced-motion: no-preference) {
  .rect { transition: width 0.35s ease, height 0.35s ease, opacity 0.2s ease; }
}
.stage[data-state="error"] .rect { opacity: 0.2; }
.dim {
  position: absolute;
  font: 500 14px/1 var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  white-space: nowrap;
}
.dim-top { left: 0; right: 0; bottom: calc(100% + 8px); text-align: center; }
.dim-left {
  top: 0;
  bottom: 0;
  right: calc(100% + 8px);
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  text-align: center;
}
.stage-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
footer {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 30px;
}
footer p {
    margin: 5px;
}
</style>

<div class="wrap">
  <header>
    <h1>Aspect Ratio Finder</h1>
    <p class="lede">Enter a width and a height. You get the simplest ratio and a shape drawn to match it.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="in-h">
      <span class="eyebrow" id="in-h">Measurements</span>
      <form id="form" autocomplete="off" novalidate>
        <div class="row">
          <div class="field">
            <label class="eyebrow" for="w">Width</label>
            <input id="w" type="text" inputmode="decimal" maxlength="20" value="1920" aria-describedby="msg">
            <span class="unit-tag" data-unit>cm</span>
          </div>
          <div class="field">
            <label class="eyebrow" for="h">Height</label>
            <input id="h" type="text" inputmode="decimal" maxlength="20" value="1080" aria-describedby="msg">
            <span class="unit-tag" data-unit>cm</span>
          </div>
        </div>
        <div class="unit-pick">
          <label class="eyebrow" for="unit">Unit</label>
          <select id="unit">
            <option value="cm">cm</option>
            <option value="mm">mm</option>
            <option value="px">px</option>
            <option value="in">in</option>
            <option value="ft">ft</option>
            <option value="">none</option>
          </select>
        </div>
      </form>

      <div class="result">
        <span class="eyebrow">Aspect ratio</span>
        <div class="ratio-line">
          <p class="ratio" id="ratio" aria-live="polite">16:9</p>
          <button class="copy" id="copy" type="button">Copy</button>
        </div>
        <p class="msg" id="msg" role="status"></p>
      </div>
    </section>

    <section class="panel" aria-labelledby="pv-h">
      <span class="eyebrow" id="pv-h">Preview</span>
      <div class="stage" id="stage" data-state="ok">
        <div class="rect" id="rect">
          <span class="dim dim-top" id="dimW">16</span>
          <span class="dim dim-left" id="dimH">9</span>
        </div>
      </div>
      <p class="stage-note">Drawn to the same proportions, scaled to fit the grid.</p>
    </section>
  </div>
  <footer>
    <p>@ Crafted by Rhema</p>
  </footer>
</div>

<script>
(function () {
  var wEl = document.getElementById('w');
  var hEl = document.getElementById('h');
  var unitEl = document.getElementById('unit');
  var ratioEl = document.getElementById('ratio');
  var msgEl = document.getElementById('msg');
  var copyBtn = document.getElementById('copy');
  var stage = document.getElementById('stage');
  var rect = document.getElementById('rect');
  var dimW = document.getElementById('dimW');
  var dimH = document.getElementById('dimH');
  var form = document.getElementById('form');

  var MAX_DECIMALS = 6;
  var PAD = 48;
  var current = null;      // last valid ratio as {a, b} strings
  var lastShape = 16 / 9;  // last valid width / height

  function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }

  // Turns "8.5" into {int: "8", frac: "5"}; returns an error string for bad input.
  function parse(raw, name) {
    var s = raw.trim().replace(',', '.');
    if (s === '') return { err: 'Enter a ' + name + '.' };
    if (/^-/.test(s)) return { err: 'The ' + name + ' must be a positive number.' };
    if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return { err: 'The ' + name + ' must be a number, like 1920 or 8.5.' };
    var parts = s.split('.');
    var int = parts[0] || '0';
    var frac = (parts[1] || '').slice(0, MAX_DECIMALS);
    if (/^0*$/.test(int + frac)) return { err: 'The ' + name + ' must be greater than zero.' };
    return { int: int, frac: frac };
  }

  function simplify(w, h) {
    var d = Math.max(w.frac.length, h.frac.length);
    var a = BigInt(w.int + w.frac.padEnd(d, '0')); 
    var b = BigInt(h.int + h.frac.padEnd(d, '0'));
    var g = gcd(a, b);
    return { a: (a / g).toString(), b: (b / g).toString() };
  }

  function draw(shape) {
    var availW = Math.max(stage.clientWidth - PAD * 2, 40);
    var availH = Math.max(stage.clientHeight - PAD * 2, 40);
    var w, h;
    if (shape > availW / availH) { w = availW; h = w / shape; }
    else { h = availH; w = h * shape; }
    rect.style.width = Math.max(w, 3) + 'px';
    rect.style.height = Math.max(h, 3) + 'px';
  }

  function update() {
    var w = parse(wEl.value, 'width');
    var h = parse(hEl.value, 'height');
    wEl.setAttribute('aria-invalid', w.err ? 'true' : 'false');
    hEl.setAttribute('aria-invalid', h.err ? 'true' : 'false');

    var err = w.err || h.err;
    if (err) {
      // Only complain about a field once the person has typed in it.
      current = null;
      ratioEl.textContent = '–:–';
      ratioEl.className = 'ratio empty';
      msgEl.textContent = err;
      copyBtn.disabled = true;
      stage.dataset.state = 'error';
      return;
    }

    var r = simplify(w, h);
    current = r;
    var text = r.a + ':' + r.b;
    ratioEl.textContent = text;
    ratioEl.className = 'ratio' + (text.length > 9 ? ' long' : '');
    msgEl.textContent = '';
    copyBtn.disabled = false;
    stage.dataset.state = 'ok';
    dimW.textContent = r.a;
    dimH.textContent = r.b;
    lastShape = Number(r.a) / Number(r.b);
    draw(lastShape);
  }

  function cleanInput(el) {
    var v = el.value.replace(/[^0-9.,\-]/g, '');
    if (v !== el.value) el.value = v;
  }

  [wEl, hEl].forEach(function (el) {
    el.addEventListener('input', function () { cleanInput(el); update(); });
  });

  unitEl.addEventListener('change', function () {
    var u = unitEl.value;
    document.querySelectorAll('[data-unit]').forEach(function (n) { n.textContent = u; });
  });

  form.addEventListener('submit', function (e) { e.preventDefault(); update(); });

  copyBtn.addEventListener('click', function () {
    if (!current) return;
    var text = current.a + ':' + current.b;
    var done = function () {
      copyBtn.textContent = 'Copied';
      setTimeout(function () { copyBtn.textContent = 'Copy'; }, 5000);
    };
    try {
      navigator.clipboard.writeText(text).then(done, function () {
        var range = document.createRange();
        range.selectNodeContents(ratioEl);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });
    } catch (e) {
      var range = document.createRange();
      range.selectNodeContents(ratioEl);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { draw(lastShape); }).observe(stage);
  } else {
    window.addEventListener('resize', function () { draw(lastShape); });
  }

  update();
})();
</script>

</body></html>
